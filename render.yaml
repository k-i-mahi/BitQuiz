# Render Blueprint: Dashboard → New → Blueprint → pick this repository.
# The database lives on Neon (free, permanent); see docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: bitquiz
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /healthz doesn't touch the database, so health checks don't keep Neon awake.
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Neon pooled connection string + "&pgbouncer=true"
      - key: DATABASE_URL
        sync: false
      # Neon direct (non-pooled) connection string, used for migrations
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ORG_NAME
        value: IEEE CS KUET
      # Gmail SMTP for invitations, password resets and verification (see docs/DEPLOY_RENDER.md)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # PUBLIC_URL defaults to the service's onrender.com address; set it only for a custom domain.
